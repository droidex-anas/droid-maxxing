name: Format automations

on:
  push:
    branches:
      - feat/automations
    paths:
      - src/features/automations/**
      - .github/workflows/format-automations.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/automations
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Automations files
        run: npx prettier --write "src/features/automations/**/*.{ts,tsx}"
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/features/automations; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/automations
          git commit -m "style(automations): format scheduling UI"
          git push origin HEAD:feat/automations
